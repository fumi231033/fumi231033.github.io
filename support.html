<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="description" content="アプリの使い方、不具合、プライバシーに関するお問い合わせを受け付けています。">
    <link rel="canonical" href="https://fumi231033.github.io/support.html">
    <title>お問い合わせ | 送料チェッカー</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; line-height: 1.75; }
      * { box-sizing: border-box; }
      body { margin: 0; background: #f4f7f6; color: #162521; }
      main { width: min(760px, calc(100% - 32px)); margin: 32px auto; }
      header, section, footer { background: #fff; border: 1px solid #dce5e2; border-radius: 16px; padding: 20px; margin-bottom: 14px; }
      h1 { margin: 0 0 8px; font-size: clamp(1.6rem, 6vw, 2.2rem); }
      h2 { margin: 0 0 10px; color: #075e52; font-size: 1.2rem; }
      p { margin: 8px 0; }
      nav { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
      a { color: #075e52; font-weight: 700; overflow-wrap: anywhere; }
      .button { display: inline-block; min-height: 44px; padding: 9px 14px; border: 2px solid #087f6b; border-radius: 10px; text-decoration: none; }
      .notice { padding: 14px; border-left: 5px solid #b45309; background: #fff3cd; border-radius: 10px; }
      .muted { color: #65736f; font-size: .92rem; }
      @media (prefers-color-scheme: dark) {
        body { background: #0f1b18; color: #eaf3f0; }
        header, section, footer { background: #172824; border-color: #34514a; }
        h2, a { color: #7de1cb; }
        .button { border-color: #7de1cb; }
        .notice { color: #fff4dc; background: #533b0e; }
        .muted { color: #b7c8c3; }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>お問い合わせ</h1>
        <p>アプリの使い方、不具合、プライバシーに関するお問い合わせを受け付けています。</p>
      </header>
      <section>
        <h2>送信前にご確認ください</h2>
        <p class="notice"><strong>投稿内容は公開されます。</strong>氏名、住所、電話番号、メールアドレス、追跡コード、売上記録などの個人情報・秘密情報は記載しないでください。</p>
        <p>不具合の場合は、個人情報を除いたうえで、アプリのバージョン、Androidのバージョン、操作手順、表示されたメッセージを記載すると確認しやすくなります。</p>
        <p><a class="button" href="https://github.com/fumi231033/fumi231033.github.io/issues/new?template=support.yml" rel="noopener noreferrer">GitHub Issuesで問い合わせる</a></p>
      </section>
      <footer>
        <nav aria-label="関連ページ">
          <a href="index.html">公式案内へ戻る</a>
          <a href="privacy-policy.html">プライバシーポリシー</a>
        </nav>
      </footer>
    </main>
  </body>
</html>
